<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Price Tag Generator</title>
    <!-- Google Fonts для интерфейса, основной шрифт загрузится через CSS -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Подключаем библиотеку для конвертации HTML в PNG -->
    <script src="https://cloudflare.com"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="render.css">
</head>
<body>

    <!-- Шапка приложения -->
    <header class="app-header">
        <div class="logo">
            <span class="icon-flash">⚡</span> TAG.GEN
        </div>
        <button id="export-btn" class="btn btn-primary">Скачать PNG</button>
    </header>

    <!-- Основной контейнер -->
    <main class="app-container">
        
        <!-- Секция настроек GitHub -->
        <section class="card config-card">
            <div class="card-header">Синхронизация с GitHub</div>
            <div class="card-body">
                <div class="input-group">
                    <label for="gh-repo">Репозиторий (username/repo)</label>
                    <input type="text" id="gh-repo" placeholder="myname/price-tags-assets">
                </div>
                <div class="input-group">
                    <label for="gh-token">GitHub Token (для приватных/частых запросов)</label>
                    <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">
                </div>
                <button id="sync-btn" class="btn btn-secondary">Обновить ассеты</button>
            </div>
        </section>

        <!-- Список товаров (Конструктор строк) -->
        <section class="card items-card">
            <div class="card-header">
                <span>Список товаров</span>
                <button id="add-item-btn" class="btn btn-sm btn-success">+ Добавить</button>
            </div>
            <div id="items-list" class="items-list">
                <!-- Строки товаров будут создаваться динамически через JS -->
            </div>
        </section>

    </main>

    <!-- Попап для выбора кастомных иконок товаров -->
    <div id="icon-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Выберите иконку товара</h3>
                <button id="close-modal-btn" class="close-btn">&times;</button>
            </div>
            <div id="icons-grid" class="icons-grid">
                <!-- Иконки из гитхаба загрузятся сюда -->
            </div>
        </div>
    </div>

    <!-- Скрытая зона для рендеринга итогового ценника -->
    <div class="render-overflow-container">
        <div id="price-tag-render-area" class="tag-grid">
            <!-- Сюда JS будет дублировать данные для генерации картинки -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
