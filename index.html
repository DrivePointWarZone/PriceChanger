<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tag Generator Pro</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Подключаем html2canvas строго через надежный CDN -->
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="render.css">
</head>
<body>

    <header class="app-header">
        <div class="logo">⚡ TAG.GEN</div>
        <button id="export-btn" class="btn btn-primary">Скачать PNG</button>
    </header>

    <main class="app-container">
        <!-- Блок синхронизации -->
        <section class="card">
            <div class="card-header">Синхронизация GitHub</div>
            <div class="card-body">
                <div class="input-group">
                    <label>Репозиторий (username/repo)</label>
                    <input type="text" id="gh-repo" placeholder="user/my-assets-repo">
                </div>
                <div class="input-group">
                    <label>Токен доступа (Token)</label>
                    <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">
                </div>
                <button id="sync-btn" class="btn btn-secondary">Обновить ассеты</button>
            </div>
        </section>

        <!-- Конструктор товаров -->
        <section class="card">
            <div class="card-header">
                <span>Список товаров</span>
                <button id="add-item-btn" class="btn btn-sm btn-success">+ Добавить</button>
            </div>
            <div id="items-list" class="items-list">
                <!-- Строки генерируются в JS -->
            </div>
        </section>
    </main>

    <!-- Попап выбора иконок -->
    <div id="icon-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Выберите иконку</h3>
                <button id="close-modal-btn" class="close-btn">&times;</button>
            </div>
            <div id="icons-grid" class="icons-grid"></div>
        </div>
    </div>

    <!-- Скрытый контейнер для генерации картинки -->
    <div class="render-overflow-container">
        <div id="price-tag-render-area" class="tag-grid"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
