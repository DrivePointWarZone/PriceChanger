<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактор ценников</title>
  <!-- Подключаем наш внешний файл стилей -->
  <link rel="stylesheet" href="style.css">
  <!-- Библиотека генерации PDF -->
  <script src="https://cloudflare.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans antialiased">

  <div class="flex flex-col lg:flex-row min-h-screen">
    
    <!-- Панель настроек (Адаптив под Айфон) -->
    <div class="w-full lg:w-5/12 bg-gray-900 p-4 sm:p-6 flex flex-col justify-between border-b lg:border-b-0 lg:border-r border-gray-800 shadow-2xl z-20">
      <div>
        <div class="flex items-center justify-between mb-6 sm:mb-8">
          <div>
            <h1 class="text-xl font-bold tracking-tight text-white">Редактор ценников</h1>
            <p class="text-xs text-gray-400">Управление позициями на листе А4</p>
          </div>
          <button onclick="exportPDF()" class="bg-yellow-500 hover:bg-yellow-400 text-gray-950 px-4 py-2.5 rounded-xl font-bold text-xs uppercase tracking-wider shadow-lg shadow-yellow-500/10 transition-all cursor-pointer">
            Скачать PDF
          </button>
        </div>

        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xs font-semibold uppercase tracking-widest text-gray-500">Товары</h2>
          <button onclick="addProduct()" class="bg-gray-800 hover:bg-gray-700 text-white px-3 py-1.5 rounded-xl text-xs font-medium flex items-center gap-1 transition-all cursor-pointer">
            + Добавить
          </button>
        </div>

        <div id="editor-rows" class="space-y-3 max-h-[50vh] lg:max-h-[calc(100vh-240px)] overflow-y-auto pr-1">
          <!-- Рендерится из JS -->
        </div>
      </div>

      <div class="mt-6 pt-4 border-t border-gray-800 text-[11px] text-gray-500 flex justify-between font-mono">
        <span>Шрифт: DDTHv-Regular</span>
        <span>Сетка: 3 в ряд</span>
      </div>
    </div>

    <!-- Область бланка А4 -->
    <div class="w-full lg:w-7/12 p-4 sm:p-8 flex justify-center items-start overflow-auto bg-gray-950 min-h-[500px]">
      <div class="origin-top scale-50 sm:scale-75 xl:scale-90 shadow-2xl rounded-lg overflow-hidden border border-gray-800">
        <div id="print-area">
          <!-- Ценники генерируются здесь -->
        </div>
      </div>
    </div>

  </div>

  <!-- Модалка выбора картинок -->
  <div id="icon-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-sm w-full p-5 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-sm font-bold text-white uppercase tracking-wider">Выберите товар</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-white text-xl font-bold cursor-pointer p-1">&times;</button>
      </div>
      <div id="modal-grid" class="grid grid-cols-3 gap-3 my-2 max-h-64 overflow-y-auto pr-1">
        <!-- Заполняется динамически -->
      </div>
    </div>
  </div>
  <script>
    // НАСТРОЙКА СВЯЗИ С ВАШИМ GITHUB:
    const GITHUB_USER = "ВАШ_ЛОГИН_НА_GITHUB"; 
    const GITHUB_REPO = "ИМЯ_РЕПОЗИТОРИЯ";     

    let ICON_DATABASE = { drink: [], snack: [] };

    let products = [
      { id: 1, name: 'Monster 0.33\nв расс', price: '300', category: 'drink', icon: '', isEnergy: true },
      { id: 2, name: 'Coca Cola 0.33', price: '250', category: 'drink', icon: '', isEnergy: false },
      { id: 3, name: 'Kit Kat', price: '150', category: 'snack', icon: '', isEnergy: false }
    ];

    let currentEditingId = null;

    // Сканирование репозитория
    async function scanGitHubIcons() {
      const categories = ['drink', 'snack'];
      for (const cat of categories) {
        const folderName = cat === 'drink' ? 'drinks' : 'snacks';
        const url = `https://github.com{GITHUB_USER}/${GITHUB_REPO}/contents/icons/${folderName}`;
        try {
          const response = await fetch(url);
          if (response.ok) {
            const files = await response.json();
            ICON_DATABASE[cat] = files
              .filter(file => file.type === 'file' && /\.(png|jpg|jpeg|svg|webp)$/i.test(file.name))
              .map(file => file.name);
          }
        } catch (e) { console.error(e); }
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await scanGitHubIcons();
      render();
    });

    function render() {
      renderControls();
      renderTiles();
    }

    function renderControls() {
      const container = document.getElementById('editor-rows');
      container.innerHTML = '';
      products.forEach(p => {
        const div = document.createElement('div');
        div.className = "bg-gray-800/60 border border-gray-800 rounded-2xl p-4 space-y-3 relative";
        div.innerHTML = `
          <button onclick="deleteProduct(${p.id})" class="absolute top-4 right-4 text-gray-500 hover:text-red-400 text-sm">🗑️</button>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1">Категория</label>
              <select onchange="updateProduct(${p.id}, 'category', this.value)" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2 text-xs text-white focus:outline-none focus:border-yellow-500">
                <option value="drink" ${p.category === 'drink' ? 'selected' : ''}>🥤 Напиток</option>
                <option value="snack" ${p.category === 'snack' ? 'selected' : ''}>🍫 Снек</option>
              </select>
            </div>
            <div>
              <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1">Изображение</label>
              <button onclick="openModal(${p.id})" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2 text-xs text-left text-gray-300 flex items-center justify-between">
                <span class="truncate pr-1">${p.icon || 'По умолчанию'}</span>
                <span>🖼️</span>
              </button>
            </div>
          </div>
          <div>
            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1">Название на ценнике</label>
            <input type="text" value="${p.name}" oninput="updateProduct(${p.id}, 'name', this.value)" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2 text-xs text-white focus:outline-none">
          </div>
          <div class="flex items-center justify-between gap-4 pt-1">
            <div class="flex items-center gap-2">
              <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Цена (₽):</label>
              <input type="number" value="${p.price}" oninput="updateProduct(${p.id}, 'price', this.value)" class="w-20 bg-gray-900 border border-gray-700 rounded-xl p-1.5 text-center text-xs font-bold text-yellow-400 focus:outline-none">
            </div>
            ${p.category === 'drink' ? `
              <label class="inline-flex items-center gap-2 text-xs text-gray-300 cursor-pointer">
                <input type="checkbox" ${p.isEnergy ? 'checked' : ''} onchange="updateProduct(${p.id}, 'isEnergy', this.checked)" class="rounded bg-gray-900 border-gray-700 text-yellow-500 w-4 h-4">
                <span class="text-xs text-gray-400">⚡ Энергетик</span>
              </label>
            ` : ''}
          </div>
        `;
        container.appendChild(div);
      });
    }

    function renderTiles() {
      const grid = document.getElementById('print-area');
      grid.innerHTML = '';
      products.forEach(p => {
        const tile = document.createElement('div');
        tile.className = "figma-tag";
        const formattedName = (p.name || 'Товар').replace(/\n/g, '<br>');
        const folderName = p.category === 'drink' ? 'drinks' : 'snacks';

        // Подгрузка иконок категорий и товаров из правильных папок
        const mainIconUrl = p.icon ? `icons/${folderName}/${p.icon}` : `icons/categories/${p.category}.png`;
        const bottomIconUrl = p.category === 'drink' ? `icons/categories/vendor.png` : `icons/categories/wrench.png`;
        const energyIconHtml = (p.category === 'drink' && p.isEnergy) ? `<img src="icons/categories/lightning.png" class="w-5 h-5 object-contain">` : '';

        tile.innerHTML = `
          <div class="flex items-start gap-3.5 z-10">
            <div class="flex-shrink-0 mt-0.5">
              <img src="${mainIconUrl}" class="w-9 h-9 object-contain" onerror="this.style.display='none'">
            </div>
            <div class="text-[17px] font-black uppercase tracking-tight leading-[1.1] text-white figma-font">
              ${formattedName}
            </div>
          </div>
          <div class="flex justify-between items-end w-full z-10">
            <div class="flex items-center gap-1.5 pb-1">
              ${energyIconHtml}
              <img src="${bottomIconUrl}" class="w-6 h-6 object-contain opacity-90" onerror="this.style.display='none'">
            </div>
            <div class="price-badge figma-font">
              <span>${p.price || '0'}</span>
              <span class="text-xs font-black ml-1 uppercase">руб.</span>
            </div>
          </div>
        `;
        grid.appendChild(tile);
      });
    }

    function addProduct() {
      products.push({ id: Date.now(), name: 'Новый товар 0.33', price: '250', category: 'drink', icon: '', isEnergy: false });
      render();
    }
    function deleteProduct(id) { products = products.filter(p => p.id !== id); render(); }
     Orc
    function updateProduct(id, key, value) {
      const p = products.find(prod => prod.id === id);
      if (p) { p[key] = value; if (key === 'category') { p.icon = ''; p.isEnergy = false; } render(); }
    }

    function openModal(id) {
      currentEditingId = id;
      const p = products.find(prod => prod.id === id);
      const grid = document.getElementById('modal-grid');
      grid.innerHTML = '';
      const list = ICON_DATABASE[p.category];
      const folderName = p.category === 'drink' ? 'drinks' : 'snacks';

      if (!list || list.length === 0) {
        grid.innerHTML = `<p class="col-span-3 text-[11px] text-gray-500 text-center py-6">Папка icons/${folderName} пуста</p>`;
      } else {
        list.forEach(filename => {
          const btn = document.createElement('button');
          btn.className = "p-2 border border-gray-800 bg-gray-950 rounded-xl hover:border-yellow-500 flex flex-col items-center justify-center transition-all";
          btn.onclick = () => { updateProduct(currentEditingId, 'icon', filename); closeModal(); };
          btn.innerHTML = `
            <img src="icons/${folderName}/${filename}" class="w-8 h-8 object-contain mb-1">
            <span class="text-[9px] text-gray-550 truncate w-full text-center">${filename}</span>
          `;
          grid.appendChild(btn);
        });
      }
      document.getElementById('icon-modal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('icon-modal').classList.add('hidden'); }

    function exportPDF() {
      const element = document.getElementById('print-area');
      html2pdf().set({
        margin: 0, filename: 'price_tags.pdf', image: { type: 'jpeg', quality: 1.0 },
        html2canvas: { scale: 4, useCORS: true, backgroundColor: '#ffffff' },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      }).from(element).save();
    }
  </script>
</body>
</html>
